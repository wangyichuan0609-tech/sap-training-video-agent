<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recordly Browser Capture Fixture</title>
    <style>
      :root {
        color: #161616;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f4f4f4;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      header {
        display: flex;
        align-items: center;
        gap: 24px;
        min-height: 64px;
        padding: 12px 28px;
        color: #fff;
        background: #0f62fe;
      }
      header h1 { margin: 0; font-size: 20px; font-weight: 600; }
      .shell-search { flex: 1; max-width: 560px; }
      main { max-width: 1180px; margin: 28px auto; padding: 0 28px; }
      .card {
        padding: 24px;
        border: 1px solid #d6d6d6;
        border-radius: 6px;
        background: #fff;
        box-shadow: 0 1px 2px rgb(0 0 0 / 8%);
      }
      .toolbar, .fields, .tabs { display: flex; gap: 16px; align-items: end; flex-wrap: wrap; }
      .field { display: grid; gap: 6px; min-width: 240px; }
      label { font-size: 14px; font-weight: 600; }
      input, select, button {
        min-height: 42px;
        border: 1px solid #8d8d8d;
        border-radius: 3px;
        padding: 8px 12px;
        font: inherit;
        background: #fff;
      }
      input:focus, select:focus, button:focus { outline: 3px solid #a6c8ff; outline-offset: 1px; }
      button { cursor: pointer; }
      button.primary { color: #fff; border-color: #0f62fe; background: #0f62fe; }
      button.secondary { color: #0f62fe; border-color: #0f62fe; }
      button.tab[aria-selected="true"] { border-bottom: 4px solid #0f62fe; font-weight: 700; }
      .value-field { display: flex; }
      .value-field input { flex: 1; border-radius: 3px 0 0 3px; }
      .value-field button { border-left: 0; border-radius: 0 3px 3px 0; }
      .status { min-height: 24px; margin: 20px 0 8px; color: #525252; }
      .spinner {
        display: inline-block;
        width: 18px;
        height: 18px;
        margin-right: 8px;
        border: 3px solid #c6c6c6;
        border-top-color: #0f62fe;
        border-radius: 50%;
        vertical-align: middle;
        animation: spin .7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      table { width: 100%; margin-top: 18px; border-collapse: collapse; }
      th, td { padding: 12px; border-bottom: 1px solid #e0e0e0; text-align: left; }
      tr[tabindex]:focus { outline: 3px solid #a6c8ff; }
      dialog { width: min(560px, calc(100vw - 48px)); border: 0; border-radius: 6px; padding: 0; }
      dialog::backdrop { background: rgb(0 0 0 / 45%); }
      dialog section { padding: 24px; }
      .hidden { display: none; }
      .detail-grid { display: grid; grid-template-columns: 180px 1fr; gap: 12px; }
      .muted { color: #6f6f6f; }
    </style>
  </head>
  <body>
    <header>
      <h1>Training Fixture</h1>
      <div class="shell-search field" data-recordly-target="shell-search">
        <label for="app-search">Search Application</label>
        <input id="app-search" type="search" autocomplete="off" placeholder="Display Supplier List" />
      </div>
      <button id="open-app" class="secondary" data-recordly-target="open-application">Open</button>
    </header>

    <main>
      <section id="list-page" class="card" aria-labelledby="page-title">
        <h2 id="page-title">Display Supplier List</h2>
        <p class="muted">Local deterministic fixture for Browser Capture and telemetry.</p>

        <div class="fields">
          <div class="field" data-recordly-target="purchasing-organization">
            <label for="purch-org">Purchasing Organization</label>
            <div class="value-field">
              <input id="purch-org" inputmode="numeric" autocomplete="off" />
              <button id="value-help" aria-label="Open Value Help" data-recordly-target="purch-org-value-help">⋯</button>
            </div>
          </div>

          <div class="field" data-recordly-target="supplier-status">
            <label for="status-select">Supplier Status</label>
            <select id="status-select">
              <option value="all">All</option>
              <option value="active">Active</option>
              <option value="blocked">Blocked</option>
            </select>
          </div>

          <button id="go" class="primary" data-recordly-target="go-button">Go</button>
        </div>

        <p id="status" class="status" role="status" aria-live="polite">Enter a filter and run the list.</p>

        <div id="results" class="hidden" data-recordly-target="result-table">
          <div class="tabs" role="tablist" aria-label="Supplier sections">
            <button id="tab-suppliers" class="tab" role="tab" aria-selected="true" data-recordly-target="suppliers-tab">Suppliers</button>
            <button id="tab-summary" class="tab" role="tab" aria-selected="false" data-recordly-target="summary-tab">Summary</button>
          </div>
          <table aria-label="Supplier results">
            <thead><tr><th>Supplier</th><th>Name</th><th>Status</th></tr></thead>
            <tbody>
              <tr id="supplier-row" tabindex="0" data-recordly-target="supplier-row-10137820">
                <td><button id="open-supplier" data-recordly-target="supplier-link-10137820">10137820</button></td>
                <td>Fixture Supplier</td>
                <td>Active</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section id="detail-page" class="card hidden" aria-labelledby="detail-title">
        <button id="back" data-recordly-target="back-to-list">Back</button>
        <h2 id="detail-title">Supplier Details</h2>
        <div class="detail-grid" data-recordly-target="supplier-detail-result">
          <strong>Supplier</strong><span>10137820</span>
          <strong>Name</strong><span>Fixture Supplier</span>
          <strong>Status</strong><span>Active</span>
        </div>
      </section>
    </main>

    <dialog id="value-help-dialog" aria-labelledby="value-help-title">
      <section>
        <h2 id="value-help-title">Select Purchasing Organization</h2>
        <button id="choose-2430" class="primary" data-recordly-target="value-help-option-2430">2430</button>
        <button id="cancel-help">Cancel</button>
      </section>
    </dialog>

    <script>
      const byId = (id) => document.getElementById(id);
      const status = byId("status");
      const dialog = byId("value-help-dialog");

      byId("open-app").addEventListener("click", () => {
        status.textContent = byId("app-search").value.trim()
          ? "Application is ready."
          : "Search for an Application first.";
      });

      byId("value-help").addEventListener("click", () => dialog.showModal());
      byId("cancel-help").addEventListener("click", () => dialog.close());
      byId("choose-2430").addEventListener("click", () => {
        byId("purch-org").value = "2430";
        byId("purch-org").dispatchEvent(new Event("change", { bubbles: true }));
        dialog.close();
      });

      byId("go").addEventListener("click", () => {
        status.innerHTML = '<span class="spinner" aria-hidden="true"></span>Loading suppliers…';
        byId("results").classList.add("hidden");
        window.setTimeout(() => {
          byId("results").classList.remove("hidden");
          status.textContent = "1 supplier found.";
        }, 650);
      });

      for (const tab of [byId("tab-suppliers"), byId("tab-summary")]) {
        tab.addEventListener("click", () => {
          byId("tab-suppliers").setAttribute("aria-selected", String(tab.id === "tab-suppliers"));
          byId("tab-summary").setAttribute("aria-selected", String(tab.id === "tab-summary"));
          status.textContent = tab.id === "tab-summary" ? "Summary is visible." : "Supplier list is visible.";
        });
      }

      function renderDetail() {
        byId("list-page").classList.add("hidden");
        byId("detail-page").classList.remove("hidden");
      }

      function renderList() {
        byId("detail-page").classList.add("hidden");
        byId("list-page").classList.remove("hidden");
      }

      byId("open-supplier").addEventListener("click", () => {
        history.pushState({ page: "detail" }, "", "#supplier-10137820");
        renderDetail();
      });
      byId("back").addEventListener("click", () => {
        history.pushState({ page: "list" }, "", location.pathname);
        renderList();
      });
      window.addEventListener("popstate", () => location.hash ? renderDetail() : renderList());
    </script>
  </body>
</html>
